[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corerag-system"
version = "0.1.0"
description = "CoreRag - Local-first knowledge engine with RAG, PII detection, and MCP integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = []
keywords = ["knowledge-management", "rag", "mcp", "embeddings", "lancedb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "lancedb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "fastmcp>=0.1.0",
    "unstructured[all-docs]>=0.10.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "pyarrow>=14.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
audio = ["mlx-whisper>=0.1.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "mutmut>=3.0",
]

[project.scripts]
corerag = "src.cli:main"
corerag-server = "src.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_mlx: marks tests that require MLX (Apple Silicon)",
    "tdd: marks tests written using Red-Green-Refactor TDD cycle",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = "python -m pytest -x -q --tb=no"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# CI/CD Pipeline for CoreRag
# Runs on every push and pull request to main

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================
  # Code Quality Checks
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy radon

      - name: Run ruff (linting + import sorting)
        run: ruff check src/ tests/

      - name: Run black (formatting)
        run: black --check src/ tests/

      - name: Run mypy (strict type checking)
        run: mypy --strict --ignore-missing-imports src/

      - name: Check cyclomatic complexity
        run: radon cc src/ -a -nc
        continue-on-error: true  # Warning, not blocker

  # ============================================
  # Unit Tests
  # ============================================
  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]  # macos-14 is Apple Silicon
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ============================================
  # Integration Tests (macOS only - needs MLX)
  # ============================================
  integration:
    name: Integration Tests
    runs-on: macos-14  # Apple Silicon for MLX
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          pytest -m integration -v --timeout=300

  # ============================================
  # Security Scanning
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Run CoreRag security scanner
        run: |
          chmod +x scripts/security_scan.sh
          ./scripts/security_scan.sh

      - name: Run bandit (security linting)
        run: bandit -r src/ -ll

      - name: Run safety (dependency vulnerabilities)
        run: safety check -r requirements.txt
        continue-on-error: true  # Don't fail on advisory-only issues

      - name: Run pip-audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

  # ============================================
  # Build & Package
  # ============================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test, security]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================
  # Diff Size Check (PR only)
  # ============================================
  diff-check:
    name: Diff Size Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff size
        env:
          MAX_LINES: "500"
        run: |
          LINES_CHANGED=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk '{ added += $1; deleted += $2 } END { print added + deleted }')
          echo "Lines changed: $LINES_CHANGED (threshold: $MAX_LINES)"
          if [ "$LINES_CHANGED" -gt "$MAX_LINES" ]; then
            echo "::warning::Large diff detected ($LINES_CHANGED lines changed). Review for scope creep — AI agents may have modified more than requested."
          fi

# Golden Dataset for Regression Testing
#
# This file contains query-answer pairs that MUST work correctly.
# Run this test suite before any changes to:
# - Embedding model
# - Chunking strategy
# - Re-ranking logic
# - Hybrid search weights
#
# Usage: pytest tests/test_golden_set.py

metadata:
  version: "1.0"
  created: "2026-01-31"
  description: "Regression test suite for PKM retrieval quality"

# Test configuration
config:
  top_k: 5                    # How many results to consider
  required_rank: 3            # Expected file must be in top N
  similarity_threshold: 0.7   # Minimum similarity score (0-1)

# Test cases
# Each case specifies:
#   query: The search query
#   expected_file: File path (relative to vault root) that MUST be found
#   expected_in_top: Must appear in top N results (default: 3)
#   tags: Optional categorization for selective testing

queries:
  # ============================================
  # Architecture & Design
  # ============================================
  - query: "What are the hardware limits for M4 Max processing?"
    expected_file: "architecture/HARDWARE_SAFETY.md"
    expected_in_top: 3
    tags: ["architecture", "hardware"]

  - query: "How do I resume a failed ingestion job?"
    expected_file: "src/utils/checkpoint.py"
    expected_in_top: 5
    tags: ["resilience", "code"]

  - query: "Privacy tiers for sensitive documents"
    expected_file: "architecture/ACCESS_CONTROL.md"
    expected_in_top: 3
    tags: ["security", "privacy"]

  - query: "How does parent-child chunking work?"
    expected_file: "architecture/CHUNKING_STRATEGY.md"
    expected_in_top: 3
    tags: ["architecture", "chunking"]

  - query: "Vector search combined with keyword search"
    expected_file: "src/search/hybrid_search.py"
    expected_in_top: 3
    tags: ["search", "code"]

  # ============================================
  # Code & Implementation
  # ============================================
